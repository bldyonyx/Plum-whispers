<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plum Whispers — illustration README</title>
    <link rel="stylesheet" href="../../src/base/variables.css">
    <link rel="stylesheet" href="preview.css">
  </head>
  <body>
    <main id="illustration" role="img" aria-label="Interface Discord abstraite aux couleurs de Plum Whispers : serveurs à gauche, salons à pattes, conversation à pois et membres à cœurs. Plum whispers, a soft, cozy Discord theme.">
      <div class="interface" aria-hidden="true">
        <aside class="servers texture dots">
          <div class="server home"></div><div class="separator"></div>
          <div class="server current"></div><div class="server"></div>
          <div class="server notification"></div><div class="server"></div>
          <div class="separator"></div><div class="server utility"></div>
        </aside>
        <aside class="channels texture paws">
          <div class="panel-header"><i class="bar name"></i><i class="chevron"></i></div>
          <div class="channel-list">
            <div class="category"><i class="bar"></i></div>
            <div class="channel"><b>#</b><i class="bar"></i></div>
            <div class="channel selected"><b>#</b><i class="bar"></i></div>
            <div class="channel"><b>#</b><i class="bar short"></i></div>
            <div class="channel"><b>#</b><i class="bar"></i></div>
            <div class="category"><i class="bar short"></i></div>
            <div class="channel"><b>#</b><i class="bar"></i></div>
            <div class="channel"><b>#</b><i class="bar short"></i></div>
            <div class="channel"><b>#</b><i class="bar"></i></div>
            <div class="category"><i class="bar"></i></div>
            <div class="channel"><b>◦</b><i class="bar short"></i></div>
            <div class="channel"><b>◦</b><i class="bar"></i></div>
          </div>
          <div class="user-panel"><i class="avatar"></i><div class="user-lines"><i class="bar"></i><i class="bar short"></i></div><i class="control"></i><i class="control"></i></div>
        </aside>
        <section class="conversation">
          <div class="panel-header chat-header"><b>#</b><i class="bar name"></i><div class="tools"><i class="control"></i><i class="control"></i><i class="search"></i></div></div>
          <div class="messages texture dots">
            <div class="message top-message"><i class="avatar"></i><div class="message-lines"><i class="bar author"></i><i class="bar long"></i><i class="bar medium"></i></div></div>
            <div class="message"><i class="avatar alternate"></i><div class="message-lines"><i class="bar author"></i><i class="bar medium"></i><i class="bar short"></i></div></div>
            <div class="hero"><h1>plum whispers</h1><p>a soft, cozy Discord theme.</p></div>
            <div class="message"><i class="avatar alternate"></i><div class="message-lines"><i class="bar author"></i><i class="bar long"></i><i class="bar medium"></i><div class="reaction"><i class="tiny-circle"></i><i class="bar"></i></div></div></div>
            <div class="message mentioned"><i class="avatar"></i><div class="message-lines"><i class="bar author"></i><div class="inline-message"><i class="mention"></i><i class="bar medium"></i></div><i class="bar short"></i></div></div>
          </div>
          <div class="composer-area"><div class="composer"><i class="control add"></i><i class="bar"></i><div class="tools"><i class="control"></i><i class="control"></i></div></div></div>
        </section>
        <aside class="members texture hearts">
          <div class="category"><i class="bar"></i></div>
          <div class="member"><i class="avatar"></i><i class="bar"></i></div>
          <div class="member"><i class="avatar alternate"></i><i class="bar short"></i></div>
          <div class="member"><i class="avatar"></i><i class="bar"></i></div>
          <div class="member"><i class="avatar alternate"></i><i class="bar short"></i></div>
          <div class="category"><i class="bar short"></i></div>
          <div class="member muted"><i class="avatar"></i><i class="bar"></i></div>
          <div class="member muted"><i class="avatar alternate"></i><i class="bar short"></i></div>
          <div class="member muted"><i class="avatar"></i><i class="bar"></i></div>
        </aside>
      </div>
    </main>
  </body>
</html>
